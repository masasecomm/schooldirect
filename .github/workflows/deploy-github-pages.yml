name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerender_mode:
        description: "Prerender scope: key hub pages (fast) or every school page (slow)"
        required: true
        default: "key"
        type: choice
        options:
          - "key"
          - "full"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # Custom domain (CNAME) => base "/".
        # For a project page, set VITE_BASE to "/<repo>/" instead.
        env:
          VITE_BASE: "/"
        run: bun run build

      - name: Save SPA shell for the 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Prerender pages for SEO
        env:
          PRERENDER_MODE: ${{ github.event.inputs.prerender_mode || 'key' }}
        run: node scripts/prerender.mjs

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
